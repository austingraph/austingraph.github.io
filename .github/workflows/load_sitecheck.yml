name: Load Site Check data

# Precomputes the parcel "Site Check" flags by loading Austin/FEMA regulatory
# layers into PostGIS and spatial-joining them onto public.parcels. Run on demand
# from the Actions tab. Austin's ArcGIS/Socrata-map layers are not browser-CORS
# friendly, so these are precomputed server-side (like the FLUM/zoning joins).
#
#   floodplain                       → parcels.sitecheck_flood (FEMA, repo geojson)
#   watershed / jurisdiction / historic → parcels.sitecheck_* (Austin open data)
#
# mode = inspect lists the source fields without writing (use it to verify data).

on:
  workflow_dispatch:
    inputs:
      layer:
        description: "Which Site Check layer to (re)load"
        type: choice
        default: "floodplain"
        options: ["floodplain", "watershed", "jurisdiction"]
      mode:
        description: "load = write to DB · inspect = report source fields only"
        type: choice
        default: "load"
        options: ["load", "inspect"]

concurrency:
  group: load-sitecheck
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scripts/ingest/requirements.txt

      - name: Load floodplain
        if: ${{ inputs.layer == 'floodplain' }}
        run: python scripts/ingest/load_floodzones.py

      - name: Load overlay (watershed / jurisdiction / historic)
        if: ${{ inputs.layer != 'floodplain' }}
        run: |
          FLAG=""; [ "${{ inputs.mode }}" = "inspect" ] && FLAG="--inspect"
          python scripts/ingest/load_overlay.py --layer "${{ inputs.layer }}" $FLAG
